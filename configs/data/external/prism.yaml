# @package data.external.prism
library: prism
role: external_validation
raw_files:
  dose_response: data/raw/prism/secondary-screen-dose-response-curve-parameters.csv
  treatment: data/raw/prism/secondary-screen-replicate-collapsed-treatment-info.csv
  lfc: data/raw/prism/secondary-screen-replicate-collapsed-logfold-change.csv
label:
  column: auc
  sensitivity_score: "-auc"
  direction: higher_auc_more_resistant
matching:
  cell_line: depmap_id
  compound: smiles_inchikey_then_name
evaluation:
  mode: external_cell_line_generalization
  no_training: true
