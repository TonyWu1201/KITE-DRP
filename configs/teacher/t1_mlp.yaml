# @package teacher
# T1-MLP：容量对照。冻结 P1，只读 z_pair 的残差头；不含局部图。
#
# 与 t1_local 共用 coverage/observed 门控、优化预算和初始化口径，用来回答
# “局部图的增益是否只是多了一个预测头/更多参数”。
name: t1_mlp
variant: t1_mlp
kind: mlp_head
# ---- P1 backbone ----
drug_encoder: morgan_targets
use_morgan: true
use_targets: true
use_gin: false
target_embed_dim: 16
d_model: 256
n_heads: 4
n_layers: 2
dropout: 0.1
top_k: 64
use_neighbor: true
neighbor_source: auto
modality_dropout: 0.15
token_types: true
rank_embedding: true
cell_readout: attention
masked_modalities: true
cross_gate: true
readout: sum
use_dense_shortcut: false
shared_pathway: false
shared_pathway_proj: false
use_cls_proj: true
cls_proj_mode: lowrank
cls_proj_rank: 64
target_branch: true
target_gene_layers: 1
target_max_tokens: 64
modalities: [GE, MU, CNV]
params_target: 5_200_000
init_from: null

# 仍构建局部图以复用 coverage/observed 门控；MLP 头不读取图节点。
local_graph:
  enabled: true
  ppi_min_score: 0.7
  max_neighbors_per_target: 8
  max_nodes_per_drug: 64
  neighbor_mode: ppi
  rewire: none
  coverage: any
  hidden: 64
  readout_hidden: 128
  condition_on: pair
  propagation: trainable
  dropout: 0.1
  residual_shrink: 1.0
  seed: 20261120
  mlp_hidden: 214

train:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  rank_weight: 0.0
  cls_weight: 0.0
  group_by_drug: false
  ema_decay: 0.0
  min_epochs: 0
  freeze_p1_epochs: 0
  p1_lr_mult: 1.0
  graph_weight: 0.0
  graph_cls_weight: 0.0
