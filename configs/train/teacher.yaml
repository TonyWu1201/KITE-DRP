# @package train
# 教师训练默认口径（计划书 §6.3 S0、§7.5 统计规范）。
# 具体教师可用 configs/teacher/*.yaml 的 lr / weight_decay / epochs / patience 覆盖。
batch_size: 512
epochs: 20
lr: 2.0e-4
weight_decay: 1.0e-3
warmup_steps: 200
grad_clip: 1.0
amp: true
device: auto
patience: 5
# 主终点：验证集 SCC（与计划书 ΔSCC 对齐）；辅助看 R²/AUROC
monitor: val_scc
monitor_mode: max
huber_delta: 1.0
cls_weight: 0.5
# P0：同药物内 pairwise ranking（默认关闭，保持 v1 旧结果可复现）
rank_weight: 0.0
rank_temperature: 1.0
rank_min_delta: 0.1
rank_max_pairs: 1024
rank_warmup_epochs: 0
# rank_weight > 0 时默认启用，也可显式指定
group_by_drug: false
drugs_per_batch: 8
cells_per_drug: 64
# EMA / 最小训练轮数（默认关闭）
ema_decay: 0.0
min_epochs: 0
# test 只在最终模型上开启；默认不评，避免泄漏
eval_test: false
